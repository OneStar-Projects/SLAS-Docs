title: SLAS 文檔
description: Student-Led Activities System — 對客戶開放的設計與操作文檔
lang: zh-HK

# just-the-docs 透過 remote_theme 載入，GitHub Pages 原生支援此插件
remote_theme: just-the-docs/just-the-docs

# 內建 Mermaid 支援（v0.7 起）。本倉庫 16 份文檔中有 9 份使用 ```mermaid 流程圖，
# 沒有這段設定的話，Jekyll 會把它們原樣輸出成程式碼區塊。
mermaid:
  version: "11.4.1"

# 導航與版面
nav_sort: case_sensitive
heading_anchors: true
color_scheme: light

# 每頁顯示目錄
toc:
  enabled: true

# 頁尾連回倉庫，方便讀者回看原始 Markdown
aux_links:
  "在 GitHub 上檢視":
    - "https://github.com/OneStar-Projects/SLAS-Docs"
aux_links_new_tab: true

# 搜尋
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/　-〿＀-￯]+/

# 不需要進入站點的檔案
exclude:
  - CR/
  - README.md.bak
  - vendor/
  - Gemfile
  - Gemfile.lock
